# ─── SonarCloud (Automatic Analysis) ─────────────────────────────────
# โปรเจกต์นี้ใช้ Automatic Analysis: SonarCloud สแกนให้เองทุกครั้งที่ push
# ไม่ต้องมี GitHub Actions workflow. ไฟล์นี้แค่บอก sources/exclusions.
sonar.sources=app
sonar.sourceEncoding=UTF-8

# ─── Exclusions (Next.js) ────────────────────────────────────────────
# หมายเหตุ: Automatic Analysis ไม่อ่าน sonar.sources — มันสแกนทั้ง repo
# แล้วตัดตาม sonar.exclusions เท่านั้น
#
# components/ui/** = shadcn/ui primitives ที่ generate มา (vendored) เราไม่ได้
# เขียนเองและจะถูกทับทุกครั้งที่ `shadcn add` ⇒ ไม่นับเป็นโค้ดของโปรเจกต์
#
# ต้องเขียนเป็น `components/ui/**/*` ด้วย ไม่ใช่แค่ `components/ui/**`:
# ใน glob ของ Sonar เครื่องหมาย `**` แทน "path segment ตั้งแต่ศูนย์อันขึ้นไป"
# ดังนั้น `components/ui/**` จับได้แค่ตัวโฟลเดอร์ ไฟล์ที่วางอยู่ในนั้นตรง ๆ
# อย่าง breadcrumb.tsx จึงหลุดออกมา แล้วโดนแจ้ง S6819 เรื่อง role="link" /
# role="presentation" ทั้งที่เป็นโค้ดที่ `shadcn add` เขียนให้ ไม่ใช่ของเรา
# แก้ที่ไฟล์ vendored ไม่ได้ เพราะรอบหน้าที่ generate ก็ถูกทับกลับเหมือนเดิม
sonar.exclusions=**/.next/**,**/out/**,**/node_modules/**,**/dist/**,**/build/**,**/*.log,components/ui/**,components/ui/**/*

# ─── Copy-paste detection: content and fixtures only ─────────────────
# ไฟล์เหล่านี้เป็น "ข้อมูล" ไม่ใช่ logic: ข้อความกฎหมายสองภาษาที่ใช้โครงเดียวกัน
# (lib/legal), รายการลิงก์หน้า dev (app/screens), และ fixture/mock ที่เป็น array
# ของ object หน้าตาเดียวกัน ตัวจับ duplication ไม่สนค่า string เลยนับโครงที่ซ้ำ
# ของข้อมูลเป็นโค้ดซ้ำ ยกเว้นเฉพาะการนับ duplication เท่านั้น ไฟล์ยังถูกตรวจ
# bug/code smell ตามปกติ
sonar.cpd.exclusions=lib/legal/**/*,app/screens/**/*,lib/mock-db/**/*,lib/catalogue/services.ts,lib/admin/verification.ts
